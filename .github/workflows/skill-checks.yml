name: skill-checks

# Reusable, model-free checks for a repository of Agent Skills. A target repo
# calls it from its own workflow:
#
#   jobs:
#     skills:
#       uses: mdsmithaustin/skill-ci/.github/workflows/skill-checks.yml@<ref>
#       with:
#         skills-dir: skills
#         skill-ci-ref: <ref>
#
# Nothing in this file calls a model. Behavioral runs are operator-local
# (skill-tasks.toml) and never PR-gated. The runner pin lives in runner.lock.

on:
  workflow_call:
    inputs:
      skills-dir:
        description: Directory holding one subdirectory per skill.
        type: string
        default: skills
      pii-scope:
        description: skills (default) scans only the skills tree; repository scans every tracked file
        type: string
        required: false
        default: skills
      trigger-cases:
        description: optional path to a version-1 trigger declaration corpus; when set, frontmatter checking also verifies every skill is declared in it
        type: string
        required: false
        default: ''
      content-ignore-file:
        description: optional path to a list of skill names that live in another repository, one per line, '#' comments allowed; they are never treated as broken sibling references
        type: string
        required: false
        default: ''
      content-link-exceptions-file:
        description: optional path to a version-1 JSON file of exact missing direct inline Markdown links that are created at output time
        type: string
        required: false
        default: ''
      evals-dir:
        description: directory holding eval manifests when they live outside the skills tree; the default searches the skills tree for backward compatibility
        type: string
        required: false
        default: ''
      require-manifests:
        description: Fail when no manifest files are found. Empty scaffolded manifests still validate.
        type: boolean
        default: false
      package-check:
        description: Inspect every package entry and reject symlinks and special files. Does not run an installer or model.
        type: boolean
        default: false
      strict-frontmatter:
        description: Reject frontmatter keys outside name and description. Not implemented yet; see TODO.md.
        type: boolean
        default: false
      skill-ci-ref:
        description: Ref of mdsmithaustin/skill-ci to fetch tools and runner.lock from. Pass the same ref as the uses line.
        type: string
        default: main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdsmithaustin/skill-ci
          ref: ${{ inputs.skill-ci-ref }}
          path: .skill-ci
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lint dependency
        run: python3 -m pip install --require-hashes -r .skill-ci/tools/requirements.txt
      - name: strict-frontmatter is not implemented
        if: inputs.strict-frontmatter
        run: |
          echo "::error::strict-frontmatter is not implemented; the allowed-keys policy is tracked in skill-ci TODO.md"
          exit 1
      - name: Local copies match the shared checkers
        run: |
          drift=0
          for f in check-skill-frontmatter.py check-skill-content.py check-pii.py requirements.txt; do
            if [ -f "tools/$f" ]; then
              if cmp -s "tools/$f" ".skill-ci/tools/$f"; then
                echo "tools/$f matches the shared copy"
              else
                echo "tools/$f has drifted from skill-ci's copy" >&2
                drift=1
              fi
            fi
          done
          exit $drift

      - name: Skill package integrity
        if: inputs.package-check
        env:
          SKILLS_DIR: ${{ inputs.skills-dir }}
        run: python3 .skill-ci/tools/check-skill-package.py --skills-dir "$SKILLS_DIR"

      - name: Reject PII
        env:
          SKILLS_DIR: ${{ inputs.skills-dir }}
          PII_SCOPE: ${{ inputs.pii-scope }}
        run: |
          if [ "$PII_SCOPE" = repository ]; then
            python3 .skill-ci/tools/check-pii.py
          else
            git ls-files -z -- "$SKILLS_DIR" \
              | xargs -0 python3 .skill-ci/tools/check-pii.py
          fi
      - name: Skill frontmatter
        env:
          SKILLS_DIR: ${{ inputs.skills-dir }}
          TRIGGER_CASES: ${{ inputs.trigger-cases }}
        run: |
          if [ -n "$TRIGGER_CASES" ]; then
            python3 .skill-ci/tools/check-skill-frontmatter.py "$SKILLS_DIR" --triggers "$TRIGGER_CASES"
          else
            python3 .skill-ci/tools/check-skill-frontmatter.py "$SKILLS_DIR"
          fi
      - name: Skill links, references, and port substitutions
        env:
          SKILLS_DIR: ${{ inputs.skills-dir }}
          IGNORE_FILE: ${{ inputs.content-ignore-file }}
          LINK_EXCEPTIONS_FILE: ${{ inputs.content-link-exceptions-file }}
        run: |
          command=(python3 .skill-ci/tools/check-skill-content.py "$SKILLS_DIR")
          if [ -n "$IGNORE_FILE" ]; then
            ignore=$(grep -v '^[[:space:]]*#' "$IGNORE_FILE" | grep -v '^[[:space:]]*$' | paste -sd, -)
            command+=(--ignore "$ignore")
          fi
          if [ -n "$LINK_EXCEPTIONS_FILE" ]; then
            command+=(--link-exceptions-file "$LINK_EXCEPTIONS_FILE")
          fi
          "${command[@]}"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdsmithaustin/skill-ci
          ref: ${{ inputs.skill-ci-ref }}
          path: .skill-ci
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python3 -m pip install uv==0.12.7
      - name: Install the pinned runner from runner.lock
        run: |
          set -euo pipefail
          spec="$(grep -v '^#' .skill-ci/runner.lock | grep -v '^[[:space:]]*$')"
          echo "runner: $spec"
          uv tool install "$spec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate manifests and audit readiness
        env:
          SKILLS_DIR: ${{ inputs.skills-dir }}
          EVALS_DIR: ${{ inputs.evals-dir }}
          REQUIRE_MANIFESTS: ${{ inputs.require-manifests }}
        run: |
          set -euo pipefail
          if [ -n "$EVALS_DIR" ]; then
            if [ ! -d "$EVALS_DIR" ]; then
              echo "::error::evals-dir is set to '$EVALS_DIR', which is not a directory; no manifest would be checked"
              exit 1
            fi
            search=(find "$EVALS_DIR" -name shared-benchmark.json)
          else
            search=(find "$SKILLS_DIR" -path '*/evals/shared-benchmark.json')
          fi
          count=0
          while IFS= read -r manifest; do
            count=$((count + 1))
            skill-benchmark validate --strict-leakage "$manifest"
            if [ "$(jq '.cases | length' "$manifest")" -eq 0 ]; then
              echo "$manifest: no cases yet, readiness audit skipped"
            else
              skill-benchmark audit-manifest --fail-on-blockers --strict-judge "$manifest"
            fi
          done < <("${search[@]}" | sort)
          echo "manifests checked: $count"
          if [ "$REQUIRE_MANIFESTS" = true ] && [ "$count" -eq 0 ]; then
            echo "::error::require-manifests is enabled, but no manifest files were checked"
            exit 1
          fi
