# The behavioral runner is pinned by commit in pyproject.toml as a git URL.
# Dependabot ignores it, because moving it is a judgement call gated on the
# fork's tests. See DECISIONS.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: skill-eval-harness-ext
