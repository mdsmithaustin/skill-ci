# mise task file. A target repo includes it from its own mise.toml:
#
#   [env]
#   SKILL_CI = "{{ config_root }}/../skill-ci"
#   [task_config]
#   includes = ["../skill-ci/skill-tasks.toml"]
#
# or copies these tables in. Every task reads SKILL_CI (the skill-ci checkout)
# and SKILLS_DIR (default "skills"). Set EVALS_DIR when the manifests live
# outside the skills tree, at EVALS_DIR/<skill>/shared-benchmark.json; unset,
# every task looks inside the skills tree. Requires uv on PATH.
#
# skill-lint, skill-validate, skill-audit are model-free and run in CI too.
# skill-trigger and skill-run drive the host's own claude and codex logins,
# spend model budget, and never run in CI. Claude runs through tools/claude-project-only
# and Codex through tools/codex-project-only, so user-level skills stay out of the
# workspace on both harnesses while the logins keep working.

[skill-lint]
description = "Frontmatter, links, references, port substitutions (model-free)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
SKILLS_DIR="${SKILLS_DIR:-skills}"
py() { uv run --no-project --with-requirements "$SKILL_CI/tools/requirements.txt" python "$@"; }
py "$SKILL_CI/tools/check-skill-frontmatter.py" "$SKILLS_DIR"
if [ -n "${CONTENT_LINK_EXCEPTIONS_FILE:-}" ]; then
  py "$SKILL_CI/tools/check-skill-content.py" --link-exceptions-file "$CONTENT_LINK_EXCEPTIONS_FILE" "$SKILLS_DIR"
else
  py "$SKILL_CI/tools/check-skill-content.py" "$SKILLS_DIR"
fi
'''

[skill-package]
description = "Inspect package trees and optionally compare installed copies (model-free)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
package_command=(uv run --no-project python "$SKILL_CI/tools/check-skill-package.py" --skills-dir "${SKILLS_DIR:-skills}")
if [ -n "${INSTALLED_SKILLS_DIR:-}" ]; then
  package_command+=(--compare-to "$INSTALLED_SKILLS_DIR")
fi
"${package_command[@]}"
'''

[skill-validate]
description = "skill-benchmark validate --strict-leakage on every manifest (model-free)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
SKILLS_DIR="${SKILLS_DIR:-skills}"
EVALS_DIR="${EVALS_DIR:-}"
runner() { uv run --no-project python "$SKILL_CI/tools/run_runner.py" "$@"; }
if [ -n "$EVALS_DIR" ] && [ ! -d "$EVALS_DIR" ]; then
  echo "EVALS_DIR is set to '$EVALS_DIR', which is not a directory; no manifest would be checked" >&2
  exit 1
fi
find_manifests() {
  if [ -n "$EVALS_DIR" ]; then
    find "$EVALS_DIR" -name shared-benchmark.json
  else
    find "$SKILLS_DIR" -path '*/evals/shared-benchmark.json'
  fi
}
find_manifests | sort | while IFS= read -r manifest; do
  runner skill-benchmark validate --strict-leakage "$manifest"
done
'''

[skill-audit]
description = "Readiness audit on every manifest, judge independence included (model-free)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
SKILLS_DIR="${SKILLS_DIR:-skills}"
EVALS_DIR="${EVALS_DIR:-}"
runner() { uv run --no-project python "$SKILL_CI/tools/run_runner.py" "$@"; }
if [ -n "$EVALS_DIR" ] && [ ! -d "$EVALS_DIR" ]; then
  echo "EVALS_DIR is set to '$EVALS_DIR', which is not a directory; no manifest would be checked" >&2
  exit 1
fi
find_manifests() {
  if [ -n "$EVALS_DIR" ]; then
    find "$EVALS_DIR" -name shared-benchmark.json
  else
    find "$SKILLS_DIR" -path '*/evals/shared-benchmark.json'
  fi
}
find_manifests | sort | while IFS= read -r manifest; do
  runner skill-benchmark audit-manifest --fail-on-blockers --strict-judge "$manifest"
done
'''

[skill-trigger]
description = "Operator-local trigger matrix for one skill on the host's claude and codex logins (paid, never CI)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
runner() { uv run --no-project python "$SKILL_CI/tools/run_runner.py" "$@"; }
skill="{{arg(name="skill", help="skill directory, e.g. skills/unslop")}}"
if [ -n "${EVALS_DIR:-}" ]; then
  manifest="$EVALS_DIR/$(basename "$skill")/shared-benchmark.json"
else
  manifest="$skill/evals/shared-benchmark.json"
fi
out="${OUT:-$skill/eval-runs/trigger-$(date +%Y%m%d-%H%M%S)}"
mkdir -p "$out"
runner skill-trigger-matrix "$manifest" --agent claude --agent codex \
  --claude-bin "$SKILL_CI/tools/claude-project-only" \
  --codex-cmd "${CODEX_CMD:-$SKILL_CI/tools/codex-project-only exec --json --skip-git-repo-check --sandbox read-only}" \
  --runs-per-query "${RUNS:-3}" ${MODEL:+--model "$MODEL"} \
  --trace-runs "$out/traces" --out "$out/trigger-matrix.json"
'''

[skill-run]
description = "Operator-local paired with/without run for one skill on the host's own logins (paid, never CI)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${SKILL_CI:?set SKILL_CI to the skill-ci checkout}"
runner() { uv run --no-project python "$SKILL_CI/tools/run_runner.py" "$@"; }
skill="{{arg(name="skill", help="skill directory, e.g. skills/unslop")}}"
if [ -n "${EVALS_DIR:-}" ]; then
  manifest="$EVALS_DIR/$(basename "$skill")/shared-benchmark.json"
else
  manifest="$skill/evals/shared-benchmark.json"
fi
out="${OUT:-$skill/eval-runs/run-$(date +%Y%m%d-%H%M%S)}"
claude_bin="$SKILL_CI/tools/claude-project-only"
codex_cmd="${CODEX_CMD:-$SKILL_CI/tools/codex-project-only exec --json --skip-git-repo-check --sandbox read-only}"

runner skill-benchmark audit-manifest "$manifest" --fail-on-blockers --strict-judge
mkdir -p "$out"
runner skill-benchmark prepare "$manifest" --split tune --runs-per-variant "${RUNS:-3}" --out "$out/tasks.jsonl"

for agent in ${AGENTS:-claude codex}; do
  case "$agent" in
    claude)
      runner skill-benchmark run-agent --agent claude --model "${MODEL:-sonnet}" \
        --claude-bin "$claude_bin" \
        --tasks "$out/tasks.jsonl" --runs "$out/claude" --timeout "${TIMEOUT:-240}"
      ;;
    codex)
      runner skill-benchmark run-agent --agent codex --model "${CODEX_MODEL:-gpt-5.6-sol}" \
        --codex-cmd "$codex_cmd" \
        --tasks "$out/tasks.jsonl" --runs "$out/codex" --timeout "${TIMEOUT:-240}"
      ;;
    *)
      echo "unsupported agent: $agent" >&2
      exit 2
      ;;
  esac
  runner skill-benchmark grade "$manifest" --runs "$out/$agent" --allow-scripts
  runner skill-benchmark judge "$manifest" --runs "$out/$agent" --judge-backend claude \
    --judge-model "${JUDGE_MODEL:-opus}" --claude-bin "$claude_bin" \
    --judge-runs "${JUDGE_RUNS:-3}" --out "$out/$agent-judge.jsonl"
  runner skill-benchmark benchmark "$manifest" --runs "$out/$agent" --split tune --allow-scripts \
    --judge-results "$out/$agent-judge.jsonl" --out "$out/$agent-benchmark.json"
  runner skill-benchmark report --benchmark "$out/$agent-benchmark.json" --format github
done
'''
